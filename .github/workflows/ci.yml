name: CI

# NOTE: this file must live at .github/workflows/ci.yml (plural "workflows").
# The project's original file was at .github/workflow/ci.yml (singular) and
# also wasn't valid YAML — GitHub Actions silently ignores anything outside
# .github/workflows/, so it was never running at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (install + syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No test script exists yet in backend/package.json (see repo review).
      # This step at least catches syntax errors across every source file
      # so a broken commit (e.g. a missing import) fails CI instead of only
      # being discovered at runtime in production.
      - name: Syntax-check all JS files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

      # Uncomment once a real test suite exists:
      # - name: Run tests
      #   run: npm test